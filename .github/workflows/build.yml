name: Build CameraUnit demo
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: oppo/CameraUnit
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Patch old build files
        run: |
          sed -i "/gradle-license-plugin/d" build.gradle
          sed -i "/com.jaredsburrows.license/d" app/build.gradle
          sed -i "s/jcenter()/mavenCentral()/g" build.gradle app/build.gradle
          grep -rn "jaredsburrows" --include=*.gradle . || echo "plugin removed"
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CameraUnit-demo-debug
          path: app/build/outputs/apk/debug/*.apk
